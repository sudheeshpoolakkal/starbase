<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="Carlito, Calibri, Arial, sans-serif" role="img" aria-label="Level 0 dataflow diagram of Starbase">
<title>Level 0 dataflow diagram of Starbase</title>
<desc>Starbase as a single process exchanging data with the Engineer, the Collaborator and the Data publishers.</desc>
