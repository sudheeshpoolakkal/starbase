<line x1="234.3" y1="764.0" x2="280.3" y2="764.0" stroke="#2a3846" stroke-width="2.2" stroke-linecap="round"/>
<text x="292.3" y="776.0" font-size="20" font-weight="400" font-style="normal" fill="#566473" text-anchor="start" dominant-baseline="alphabetic">Process</text>
