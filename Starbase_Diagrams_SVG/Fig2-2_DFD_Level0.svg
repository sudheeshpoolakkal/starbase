<text x="772.0" y="500.0" font-size="22" font-weight="400" font-style="normal" fill="#1b2733" text-anchor="start" dominant-baseline="alphabetic">Publisher files,</text>
<text x="772.0" y="527.0" font-size="22" font-weight="400" font-style="normal" fill="#1b2733" text-anchor="start" dominant-baseline="alphabetic">manifests</text>
<rect x="20.0" y="754.0" width="46.0" height="30.0" rx="0" fill="#f3f5f7" stroke="#2a3846" stroke-width="2.2" />
<text x="78.0" y="776.0" font-size="20" font-weight="400" font-style="normal" fill="#566473" text-anchor="start" dominant-baseline="alphabetic">External entity</text>
